name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Generar proyecto Android
        run: npm run android:prepare

      - name: Compilar y firmar APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Compilando versión de producción firmada con la llave fija"
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "Herramientas de firma: $BT"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ricar.keystore"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/alineado.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ricar.keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "$GITHUB_WORKSPACE/RiCar-Solutions.apk" "$RUNNER_TEMP/alineado.apk"
            "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/RiCar-Solutions.apk" | head -3
          else
            echo "AVISO: no hay llave de firma configurada; se compila una versión de prueba (hay que desinstalar para actualizar)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/RiCar-Solutions.apk"
          fi

      - name: Guardar APK como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: RiCar-Solutions-apk
          path: RiCar-Solutions.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RiCar Solutions v${{ github.run_number }}
          files: RiCar-Solutions.apk
